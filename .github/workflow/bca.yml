name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: 安装依赖
      # 虽然 import 里没写 openpyxl，但 pandas 读取 xlsx 必须依赖它
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl pyinstaller

    - name: 重命名并打包
      # 1. 临时改名为 app.py 避开中文路径打包可能引发的底层编码错误
      # 2. 使用 --name 指定最终生成的 exe 名字
      run: |
        Rename-Item -Path "运费自动化提取321.py" -NewName "app.py"
        pyinstaller --onefile --name "运费自动化提取" app.py

    - name: 上传 EXE 到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Express_Fee_Extractor_EXE
        path: dist/*.exe
        retention-days: 7
